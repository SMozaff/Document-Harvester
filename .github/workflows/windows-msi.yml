name: Windows MSI CI

# CI-only package check on windows-latest. This builds the desktop app, runs
# the non-GUI test suite, builds the MSI and uploads it as an artifact. It does
# not run the GUI, fonts or locale journeys; those require an interactive
# Windows session and owner acceptance.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  PACKAGE_VERSION: 0.0.0-ci

jobs:
  windows-msi:
    name: Build and package (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run non-GUI workspace tests
        shell: pwsh
        run: cargo test --workspace --all-targets

      - name: Build release binary
        shell: pwsh
        run: cargo build --release -p dh-app --locked

      - name: Install pinned nFPM
        shell: pwsh
        env:
          NFPM_SHA256: e410472f50b580c05087acc9a8e62bbe617a9e17226aff274f207c3b1bd31c5f
        run: |
          Invoke-WebRequest -Uri 'https://github.com/goreleaser/nfpm/releases/download/v2.49.0/nfpm_2.49.0_Windows_x86_64.zip' -OutFile nfpm.zip
          $actual = (Get-FileHash -Algorithm SHA256 nfpm.zip).Hash.ToLowerInvariant()
          if ($actual -ne $env:NFPM_SHA256) {
            throw "nFPM checksum mismatch: expected $env:NFPM_SHA256, got $actual"
          }
          Expand-Archive -Path nfpm.zip -DestinationPath nfpm-bin -Force
          $nfpm = Get-ChildItem -Path nfpm-bin -Filter 'nfpm.exe' -Recurse | Select-Object -First 1
          if (-not $nfpm) { throw 'nfpm.exe not found in release archive' }
          $installDir = Join-Path $env:RUNNER_TEMP 'nfpm-bin'
          New-Item -ItemType Directory -Path $installDir -Force | Out-Null
          Copy-Item -Path $nfpm.FullName -Destination (Join-Path $installDir 'nfpm.exe') -Force
          "$installDir" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          if (-not (Test-Path 'target/release/dh-app.exe')) { throw 'missing built dh-app.exe' }
          if (-not (Test-Path 'target/release/pdfium.dll')) { throw 'missing bundled pdfium.dll' }
          nfpm.exe package --config packaging/windows/nfpm-msi.yaml --packager msi --target document-harvester.msi

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: document-harvester-msi-ci
          path: document-harvester.msi
          if-no-files-found: error
