name: Rust CI

on:
  push:
    branches:
      - main
      - "implementation/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y pkg-config libfontconfig1-dev libreoffice-calc
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run workspace tests
        env:
          DH_S1_WORKBOOK_ARTIFACT: ${{ runner.temp }}/s1-empty-project.xlsx
          DH_LOCK_CHARACTERIZATION: ${{ runner.os == 'Linux' && '1' || '' }}
        run: cargo test --workspace --all-targets
      - name: Verify project workbook opens in LibreOffice
        if: runner.os == 'Linux'
        run: |
          mkdir -p "${RUNNER_TEMP}/s1-libreoffice-import"
          timeout 60s libreoffice --headless --convert-to ods --outdir "${RUNNER_TEMP}/s1-libreoffice-import" "${RUNNER_TEMP}/s1-empty-project.xlsx"
          test -s "${RUNNER_TEMP}/s1-libreoffice-import/s1-empty-project.ods"
      - name: Build desktop release artifact
        run: cargo build --release -p dh-app
      - name: Verify bundled PDFium loads from the app directory (Linux)
        if: runner.os == 'Linux'
        run: |
          test -f target/release/libpdfium.so
          ./target/release/dh-app --pdfium-self-test
      - name: Verify bundled PDFium loads from the app directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path target/release/pdfium.dll)) { throw 'Bundled pdfium.dll is missing' }
          & ./target/release/dh-app.exe --pdfium-self-test
          if ($LASTEXITCODE -ne 0) { throw "pdfium self-test exited with $LASTEXITCODE" }
      - name: Upload Stage 1 build and workbook artifacts
        uses: actions/upload-artifact@v4
        with:
          name: s1-build-${{ runner.os }}
          path: |
            target/release/dh-app*
            target/release/libpdfium.so
            target/release/pdfium.dll
            ${{ runner.temp }}/s1-empty-project.xlsx
          if-no-files-found: error
      - name: Record resolved dependency tree
        run: cargo tree --workspace -e all > phase0-cargo-tree.txt
      - name: Upload Phase 0 dependency evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase0-dependency-evidence-${{ matrix.os }}
          path: |
            Cargo.lock
            phase0-cargo-tree.txt
          if-no-files-found: error
